<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabeth Grace | 个人主页</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #e4ced4 0%, #cbabaa 50%, #b39798 100%) !important;
            color: #4a4a4a; 
            line-height: 1.6; 
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 🌟 使用标准的在线猫爪光标（双引号绝对保留） */
            cursor: url("https://cdn.custom-cursor.com/db/8227/32/cats-pink-paw-pointer.png"), auto !important;
        }

        /* 🌟 悬停在按钮上时的小猫爪 */
        .link-btn:hover { 
            background: rgba(255, 255, 255, 0.8) !important; 
            transform: translateY(-2px) !important; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.03) !important;
            cursor: url("https://cdn.custom-cursor.com/db/8227/32/cats-pink-paw-cursor.png"), pointer !important;
        }

        /* 背景大爱心与模糊微光 */
        .bg-glow-hearts {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .glow-heart-1 {
            position: absolute;
            top: 10%; right: 10%;
            width: 280px; height: 280px;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(-15deg);
            filter: blur(10px);
            animation: pulse 8s infinite ease-in-out;
        }
        .glow-heart-2 {
            position: absolute;
            bottom: 5%; left: 5%;
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 75%);
            transform: rotate(20deg);
            filter: blur(15px);
            animation: pulse 12s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 0.95; }
        }

        /* 🌟 发光漂浮字样式 */
        .floating-word {
            position: absolute !important;
            color: rgba(255, 255, 255, 0.85) !important;
            font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
            font-weight: 600;
            pointer-events: none;
            z-index: 2;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px rgba(255, 255, 255, 0.6);
            user-select: none;
        }
        
        .word-love {
            font-size: 6rem !important;
            top: 15% !important;
            left: 15% !important;
            animation: moveLove 8s infinite ease-in-out !important;
        }
        
        .word-future {
            font-size: 5rem !important;
            bottom: 15% !important;
            right: 15% !important;
            letter-spacing: 4px;
            animation: moveFuture 10s infinite ease-in-out !important;
        }

        /* 🌟 重新用最简单的底层逻辑编写漂浮路径，确保浏览器一定能读懂 */
        @keyframes moveLove {
            0%, 100% { transform: translateY(0px) rotate(-8deg); }
            50% { transform: translateY(-30px) rotate(-2deg); }
        }
        @keyframes moveFuture {
            0%, 100% { transform: translateY(0px) rotate(5deg); }
            50% { transform: translateY(-25px) rotate(10deg); }
        }

        /* 毛玻璃卡片容器 */
        .container { 
            width: 85%; max-width: 550px; padding: 30px; 
            background: rgba(245, 235, 235, 0.55); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06); 
            position: relative; z-index: 10; text-align: center;
        }
        .avatar-box { 
            width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 15px; 
            overflow: hidden; border: 3px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 16px rgba(0,0,0,0.05); background: #fff;
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 24px; color: #2e2e2e; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; }
        .subtitle { color: #5a5a5a; font-size: 14px; margin-bottom: 25px; font-weight: 500; }
        .section { margin-top: 25px; text-align: left; }
        h2 { font-size: 13px; color: #7d6b67; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; font-weight: 600; }
        p { font-size: 14.5px; color: #3e3e3e; background: rgba(255,255,255,0.25); padding: 12px 16px; border-radius: 12px; }
        .links { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .link-btn { 
            display: block; text-align: center; padding: 13px; 
            background: rgba(255, 255, 255, 0.45); color: #3e3e3e; 
            border-radius: 14px; text-decoration: none; font-weight: 500; font-size: 14.5px;
            border: 1px solid rgba(255,255,255,0.3); transition: all 0.3s ease; 
        }
    </style>
</head>
<body>

    <div class="bg-glow-hearts">
        <div class="glow-heart-1"></div>
        <div class="glow-heart-2"></div>
    </div>

    <div class="floating-word word-love">爱</div>
    <div class="floating-word word-future">未来</div>

    <div class="container">
        <div class="avatar-box">
            <img src="avatar.png" alt="Elizabeth Grace">
        </div> 
        <h1>Elizabeth Grace</h1>
        <p class="subtitle">心理学本科生</p>

        <div class="section">
            <h2>Research Interests / 研究方向</h2>
            <p>主要专注于 <strong>临床心理学</strong> 与 <strong>犯罪心理学</strong> 的相关研究。</p>
        </div>

        <div class="section">
            <h2>Connect / 联系我</h2>
            <div class="links">
                <a href="mailto:claenoffical@outlook.com" class="link-btn">claenoffical@outlook.com</a>
                <a href="#" class="link-btn" target="_blank">个人博客：clean official</a>
                <a href="https://v.douyin.com/46wI4itF-bI/" class="link-btn" target="_blank">社交账户：lovoe.0_0.</a>
            </div>
        </div>
    </div>

</body>
</html>
