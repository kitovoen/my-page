<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabeth Grace | 个人主页</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 🌟 背景整体改为灰粉色系，基础背景 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #fcece9; /* 基础暖灰色粉 */
            color: #333; 
            line-height: 1.6; 
            overflow-x: hidden; /* 防止漂浮文字导致页面变宽 */
            position: relative; /* 为漂浮元素提供定位参考 */
            min-height: 100vh;
        }

        /* 🌟 灰粉色渐变背景层 */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #fcece9 0%, #f7dcd5 100%);
            z-index: -2; /* 在最下面 */
        }

        /* 🌟 漂浮的白色爱心层 */
        .bg-hearts {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* 让鼠标穿过，不影响点击按钮 */
            z-index: -1; /* 在渐变层上面 */
        }
        .bg-hearts div {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.4); /* 半透明白色 */
            border-radius: 50%;
            animation: heart-float 15s infinite ease-in-out;
            opacity: 0;
        }
        /* 生成爱心形状的伪元素 */
        .bg-hearts div::after {
            content: '';
            position: absolute; width: 10px; height: 10px;
            background: inherit; border-radius: 50%; top: -6px; left: 0;
        }
        .bg-hearts div::before {
            content: '';
            position: absolute; width: 10px; height: 10px;
            background: inherit; border-radius: 50%; top: 0; left: -6px;
        }
        /* 定义爱心漂浮动画 */
        @keyframes heart-float {
            0% { transform: translateY(10vh) translateX(10vw) scale(0); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-20vh) translateX(-10vw) scale(1); opacity: 0; }
        }

        /* 🌟 漂浮的文字层 */
        .bg-floating-text {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.5); /* 半透明白色 */
            font-weight: 300;
        }
        .bg-floating-text span {
            position: absolute;
            animation: text-float 20s infinite ease-in-out;
            opacity: 0;
        }
        @keyframes text-float {
            0% { transform: translateY(10vh) translateX(10vw) scale(0.8); opacity: 0; }
            20% { opacity: 0.7; }
            100% { transform: translateY(-30vh) translateX(-15vw) scale(1.1); opacity: 0; }
        }

        /* 主体内容容器 */
        .container { 
            max-width: 600px; 
            margin: 60px auto; 
            padding: 20px; 
            background: rgba(255, 255, 255, 0.95); /* 半透明白色背景，让背景透出一点 */
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            position: relative; /* 确保内容不被覆盖 */
        }
        
        .header { text-align: center; padding: 40px 0 20px; }
        .avatar-box { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 15px; overflow: hidden; background: #e9ecef; display: flex; align-items: center; justify-content: center; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 24px; color: #111; margin-bottom: 8px; font-weight: 600; letter-spacing: -0.5px; }
        .subtitle { color: #666; font-size: 14px; }
        .section { margin-top: 30px; }
        
        /* 🌟 标题颜色也调整为更柔和的粉灰色系 */
        h2 { font-size: 15px; color: #b7a49c; /* 灰粉 */ text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; border-bottom: 1px solid #f1f3f5; padding-bottom: 5px; }
        
        p { font-size: 15px; color: #444; }
        .links { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        
        /* 🌟 链接按钮改为灰粉色系样式 */
        .link-btn { display: block; text-align: center; padding: 12px; background: #f7dcd5; /* 灰粉 */ color: #333; border-radius: 8px; text-decoration: none; font-weight: 500; transition: background 0.2s, transform 0.1s; }
        .link-btn:hover { background: #fcece9; transform: translateY(-1px); }
        .link-btn:active { transform: translateY(0); }
    </style>
</head>
<body>

    </div>

</body>
</html>
