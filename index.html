<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabeth Grace | 个人主页</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #e4ced4 0%, #cbabaa 50%, #b39798 100%);
            color: #4a4a4a; 
            line-height: 1.6; 
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 🌟 背景大爱心与模糊微光层次 */
        .bg-glow-hearts {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        /* 梦幻大爱心 1 */
        .glow-heart-1 {
            position: absolute;
            top: 10%; right: 10%;
            width: 280px; height: 280px;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(-15deg);
            filter: blur(10px);
            animation: pulse 8s infinite ease-in-out;
        }
        
        /* 梦幻大爱心 2 */
        .glow-heart-2 {
            position: absolute;
            bottom: 5%; left: 5%;
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 75%);
            transform: rotate(20deg);
            filter: blur(15px);
            animation: pulse 12s infinite ease-in-out;
        }

        /* 梦幻小爱心 3 */
        .glow-heart-3 {
            position: absolute;
            top: 40%; left: 15%;
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 70%);
            filter: blur(5px);
        }

        /* 梦幻小爱心 4 */
        .glow-heart-4 {
            position: absolute;
            bottom: 30%; right: 12%;
            width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 70%);
            filter: blur(5px);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.8; }
            50% { transform: scale(1.08) translate(-10px, 10px); opacity: 0.95; }
        }

        /* 🌟 发光发亮漂浮文字：爱 与 未来 */
        .floating-word {
            position: absolute;
            color: rgba(255, 255, 255, 0.85);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-weight: 600;
            pointer-events: none;
            z-index: 2;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.9), 0 0 40px rgba(255, 255, 255, 0.6);
            user-select: none;
        }
        
        .word-love {
            font-size: 110px;
            top: 12%;
            left: 22%;
            transform: rotate(-8deg);
            animation: float-slow-1 16s infinite ease-in-out;
        }
        
        .word-future {
            font-size: 95px;
            bottom: 12%;
            right: 20%;
            transform: rotate(5deg);
            letter-spacing: 4px;
            animation: float-slow-2 20s infinite ease-in-out;
        }

        @keyframes float-slow-1 {
            0%, 100% { transform: translateY(0) rotate(-8deg); opacity: 0.85; }
            50% { transform: translateY(-15px) rotate(-6deg); opacity: 0.95; }
        }

        @keyframes float-slow-2 {
            0%, 100% { transform: translateY(0) rotate(5deg); opacity: 0.8; }
            50% { transform: translateY(-20px) rotate(8deg); opacity: 0.95; }
        }

        /* 🌟 毛玻璃卡片容器 */
        .container { 
            width: 90%;
            max-width: 680px; 
            padding: 35px 40px; 
            background: rgba(245, 235, 235, 0.55); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06); 
            position: relative;
            z-index: 10;
            text-align: center;
        }
        
        /* 头像框 */
        .avatar-box { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            margin: -15px auto 15px; 
            overflow: hidden; 
            border: 3px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            background: #fff;
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        
        h1 { font-size: 26px; color: #2e2e2e; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; }
        .subtitle { color: #5a5a5a; font-size: 14px; margin-bottom: 25px; font-weight: 500; }
        
        .section { margin-top: 25px; text-align: left; }
        
        /* 小标题样式 */
        h2 { 
            font-size: 13px; 
            color: #7d6b67; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            margin-bottom: 10px; 
            font-weight: 600;
        }
        
        p { font-size: 14.5px; color: #3e3e3e; background: rgba(255,255,255,0.25); padding: 12px 16px; border-radius: 12px; }
        
        /* 优雅的小横排/竖排链接组 */
        .links { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        
        /* 精致的链接按钮 */
        .link-btn { 
            display: block; 
            text-align: center; 
            padding: 13px; 
            background: rgba(255, 255, 255, 0.45); 
            color: #3e3e3e; 
            border-radius: 14px; 
            text-decoration: none; 
            font-weight: 500; 
            font-size: 14.5px;
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease; 
        }
        .link-btn:hover { 
            background: rgba(255, 255, 255, 0.8); 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }
        .link-btn:active { transform: translateY(0); }
    </style>
</head>
<body>

    <!-- 🌟 立体梦幻大爱心背景（带微光） -->
    <div class="bg-glow-hearts">
        <div class="glow-heart-1"></div>
        <div class="glow-heart-2"></div>
        <div class="glow-heart-3"></div>
        <div class="glow-heart-4"></div>
    </div>

    <!-- 🌟 强烈发光的漂浮文字 -->
    <div class="floating-word word-love">爱</div>
    <div class="floating-word word-future">未来</div>

    <!-- 主体毛玻璃卡片 -->
    <div class="container">
        <div class="avatar-box">
            <!-- 依旧完美的引用你的旧头像 -->
            <img src="avatar.png" alt="Elizabeth Grace">
        </div> 
        <h1>Elizabeth Grace</h1>
        <p class="subtitle">心理学本科生</p>

        <div class="section">
            <h2>Research Interests / 研究方向</h2>
            <p>主要专注于 <strong>临床心理学</strong> 与 <strong>犯罪心理学</strong> 的相关研究。</p>
        </div>

        <div class="section">
            <h2>Connect / 联系我</h2>
            <div class="links">
                <a href="mailto:claenoffical@outlook.com" class="link-btn">claenoffical@outlook.com</a>
                <a href="#" class="link-btn" target="_blank">个人博客：clean official</a>
                <a href="https://v.douyin.com/46wI4itF-bI/" class="link-btn" target="_blank">社交账户：lovoe.0_0.</a>
            </div>
        </div>
    </div>

</body>
</html>
