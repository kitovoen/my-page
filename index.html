<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabeth Grace | 个人主页</title>
    <style>
        /* ==========================================
           1. 页面基础重置（控制光标为精致的 ♡ 心形）
           ========================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: linear-gradient(135deg, #e4ced4 0%, #cbabaa 50%, #b39798 100%) !important;
            color: #4a4a4a; 
            line-height: 1.6; 
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* 🌟 完美的 ♡ 心形光标 */
            cursor: url("https://cdn.custom-cursor.com/db/10292/32/neon-heart-pointer.png"), auto !important;
        }

        /* 鼠标悬停按钮时，变成带点击态的 ♡ 心形光标 */
        .link-btn:hover { 
            background: rgba(255, 255, 255, 0.8) !important; 
            transform: translateY(-2px) !important; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.03) !important;
            cursor: url("https://cdn.custom-cursor.com/db/10291/32/neon-heart-cursor.png"), pointer !important;
        }

        /* ==========================================
           2. 漫天雪花字飘落系统
           ========================================== */
        .snow-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2; /* 确保在背景之上 */
        }

        .snow-word {
            position: absolute !important;
            color: rgba(255, 255, 255, 0.8) !important;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            font-weight: bold;
            font-size: 16px !important; /* 清秀的雪花尺寸 */
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
            user-select: none;
            top: -50px;
        }

        /* 雪花下落并旋转的无缝循环动画 */
        @keyframes snowfall {
            0% {
                top: -10%;
                transform: translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% {
                top: 110%;
                transform: translateX(60px) rotate(360deg);
                opacity: 0;
            }
        }

        /* 严格控制各颗小雪花的位置和降落时差，制造凌乱美 */
        .s1 { left: 8%;  animation: snowfall 11s infinite linear; }
        .s2 { left: 23%; animation: snowfall 15s infinite linear; animation-delay: 2s; }
        .s3 { left: 38%; animation: snowfall 13s infinite linear; animation-delay: 4.5s; }
        .s4 { left: 53%; animation: snowfall 17s infinite linear; animation-delay: 1s; }
        .s5 { left: 68%; animation: snowfall 12s infinite linear; animation-delay: 6s; }
        .s6 { left: 83%; animation: snowfall 14s infinite linear; animation-delay: 3s; }
        .s7 { left: 16%; animation: snowfall 16s infinite linear; animation-delay: 8s; }
        .s8 { left: 60%; animation: snowfall 13s infinite linear; animation-delay: 10s; }
        .s9 { left: 91%; animation: snowfall 18s infinite linear; animation-delay: 3.5s; }

        /* ==========================================
           3. 主体毛玻璃名片容器（安全锁定尺寸）
           ========================================== */
        .container { 
            width: 88%; 
            max-width: 500px; 
            padding: 30px; 
            background: rgba(245, 235, 235, 0.55); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06); 
            position: relative; 
            z-index: 10; 
            text-align: center;
        }
        
        /* 🌟 严格限制头像区域尺寸，绝对不允许它变大 */
        .avatar-box { 
            width: 100px !important; 
            height: 100px !important; 
            border-radius: 50% !important; 
            margin: 0 auto 15px !important; 
            overflow: hidden !important; 
            border: 3px solid rgba(255, 255, 255, 0.7) !important;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05) !important;
            background: #fff !important;
        }
        .avatar-box img { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover !important; 
        }
        
        h1 { font-size: 24px; color: #2e2e2e; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; }
        .subtitle { color: #5a5a5a; font-size: 14px; margin-bottom: 25px; font-weight: 500; }
        .section { margin-top: 25px; text-align: left; }
        h2 { font-size: 13px; color: #7d6b67; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; font-weight: 600; }
        p { font-size: 14.5px; color: #3e3e3e; background: rgba(255,255,255,0.25); padding: 12px 16px; border-radius: 12px; }
        
        .links { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .link-btn { 
            display: block; text-align: center; padding: 13px; 
            background: rgba(255, 255, 255, 0.45); color: #3e3e3e; 
            border-radius: 14px; text-decoration: none; font-weight: 500; font-size: 14.5px;
            border: 1px solid rgba(255,255,255,0.3); transition: all 0.3s ease; 
        }
    </style>
</head>
<body>

    <div class="snow-container">

        <div class="snow-word s3">爱</div>
        <div class="snow-word s4">未来</div>
        <div class="snow-word s5">爱</div>
        <div class="snow-word s6">未来</div>
        <div class="snow-word s7">未来</div>
        <div class="snow-word s8">爱</div>

    </div>

    <div class="container">

        </div>

        <p class="subtitle">心理学本科生</p>

        <div class="section">

        </div>

            </div>
        </div>
    </div>

</body>
</html>
