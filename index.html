<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elizabeth Grace | 个人主页</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #e4ced4 0%, #cbabaa 50%, #b39798 100%) !important;
            color: #4a4a4a; 
            line-height: 1.6; 
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* 🌟 给你安排了精致的在线 ♡ 心形光标！ */
            cursor: url("https://cdn.custom-cursor.com/db/10292/32/neon-heart-pointer.png"), auto !important;
        }

        /* 🌟 当鼠标悬停在按钮上时，变成点击状态的 ♡ 心形光标 */
        .link-btn:hover { 
            background: rgba(255, 255, 255, 0.8) !important; 
            transform: translateY(-2px) !important; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.03) !important;
            cursor: url("https://cdn.custom-cursor.com/db/10291/32/neon-heart-cursor.png"), pointer !important;
        }

        /* 背景大爱心微光 */
        .bg-glow-hearts {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .glow-heart-1 {
            position: absolute;
            top: 10%; right: 10%;
            width: 280px; height: 280px;
            background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 70%);
            filter: blur(10px);
        }
        .glow-heart-2 {
            position: absolute;
            bottom: 5%; left: 5%;
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 75%);
            filter: blur(15px);
        }

        /* 雪花飘落字通用样式 */
        .snow-word {
            position: absolute !important;
            color: rgba(255, 255, 255, 0.75) !important;
            font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
            font-weight: 500;
            font-size: 18px; 
            pointer-events: none;
            z-index: 2;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            user-select: none;
            top: -50px;
        }

        /* 下雪动画 */
        @keyframes snowfall {
            0% {
                top: -10%;
                transform: translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                top: 110%;
                transform: translateX(80px) rotate(360deg);
                opacity: 0;
            }
        }

        /* 错落有致的雪花阵位置 */
        .s1 { left: 10%; animation: snowfall 12s infinite linear; }
        .s2 { left: 25%; animation: snowfall 16s infinite linear; animation-delay: 2s; }
        .s3 { left: 40%; animation: snowfall 14s infinite linear; animation-delay: 5s; }
        .s4 { left: 55%; animation: snowfall 18s infinite linear; animation-delay: 1s; }
        .s5 { left: 70%; animation: snowfall 13s infinite linear; animation-delay: 7s; }
        .s6 { left: 85%; animation: snowfall 15s infinite linear; animation-delay: 3s; }
        .s7 { left: 18%; animation: snowfall 17s infinite linear; animation-delay: 9s; }
        .s8 { left: 65%; animation: snowfall 14s infinite linear; animation-delay: 11s; }
        .s9 { left: 92%; animation: snowfall 19s infinite linear; animation-delay: 4s; }
    </style>
</head>
<body>

    <div class="bg-glow-hearts">
        <div class="glow-heart-1"></div>
        <div class="glow-heart-2"></div>
    </div>

    <div class="snow-word s1">爱</div>
    <div class="snow-word s2">未来</div>
    <div class="snow-word s3">爱</div>
    <div class="snow-word s4">未来</div>
    <div class="snow-word s5">爱</div>
    <div class="snow-word s6">未来</div>
    <div class="snow-word s7">未来</div>
    <div class="snow-word s8">爱</div>
    <div class="snow-word s9">未来</div>

    <div class="container">
        <div class="avatar-box">
            <img src="avatar.png" alt="Elizabeth Grace">
        </div> 
        <h1>Elizabeth Grace</h1>
        <p class="subtitle">心理学本科生</p>

            <p>主要专注于 <strong>临床心理学</strong> 与 <strong>犯罪心理学</strong> 的相关研究。</p>
        </div>

            </div>
        </div>
    </div>

</body>
</html>
